name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint (ruff)
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Check formatting
        run: ruff format --check .

      - name: Check lint
        run: ruff check .

  # ---------------------------------------------------------------------------
  # 2. Unit + E2E tests (default mode — no browser required)
  # ---------------------------------------------------------------------------
  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (Playwright E2E skipped automatically when [js] not installed)
        run: pytest tests/ -v --tb=short

  # ---------------------------------------------------------------------------
  # 3. Playwright JS tests (separate job — installs Chromium with caching)
  # ---------------------------------------------------------------------------
  test-js:
    name: Tests (Playwright / JS path)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev + js dependencies
        run: pip install -e ".[dev,js]"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pytest tests/test_js_driver.py -v --tb=short
