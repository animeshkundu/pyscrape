site_name: pyscrape
site_url: https://animeshkundu.github.io/pyscrape/
site_description: Lightweight Python 3 web scraping library
repo_url: https://github.com/animeshkundu/pyscrape
repo_name: animeshkundu/pyscrape

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - content.code.copy

nav:
  - Home: index.md
  - API Reference: api.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.details
